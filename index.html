                reviews: 2800,

        const CATEGORIES = [
            { id: 'all', name: 'All Web Apps', icon: 'fa-border-all' },
            { id: 'favorites', name: 'Favorites', icon: 'fa-heart text-rose-500' },
            { id: 'AI Tools', name: 'AI Tools', icon: 'fa-robot' },
            { id: 'Productivity', name: 'Productivity', icon: 'fa-briefcase' },
            { id: 'Development', name: 'Development', icon: 'fa-code' },
            { id: 'Design', name: 'Design', icon: 'fa-palette' },
            { id: 'Entertainment', name: 'Entertainment', icon: 'fa-gamepad' },
            { id: 'Education', name: 'Education', icon: 'fa-graduation-cap' },
            { id: 'Social Media', name: 'Social Media', icon: 'fa-share-nodes' }
        ];

        const { useState, useEffect, useMemo } = React;

        function App() {
            // State
            const [apps, setApps] = useState(WEB_APPS);
            const [activeCategory, setActiveCategory] = useState('all');
            const [searchQuery, setSearchQuery] = useState('');
            const [sortBy, setSortBy] = useState('popular');
            const [favorites, setFavorites] = useState(() => {
                try {
                    const saved = localStorage.getItem('webstore_favorites');
                    return saved ? JSON.parse(saved) : [];
                } catch(e) {
                    return [];
                }
            });
            const [isDarkMode, setIsDarkMode] = useState(() => {
                try {
                    const savedTheme = localStorage.getItem('theme');
                    return savedTheme ? savedTheme === 'dark' : true;
                } catch(e) {
                    return true;
                }
            });
            const [selectedApp, setSelectedApp] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);

            // Sync Dark Mode Class
            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                    try { localStorage.setItem('theme', 'dark'); } catch(e) {}
                } else {
                    document.documentElement.classList.remove('dark');
                    try { localStorage.setItem('theme', 'light'); } catch(e) {}
                }
            }, [isDarkMode]);

            // Save Favorites
            useEffect(() => {
                try {
                    localStorage.setItem('webstore_favorites', JSON.stringify(favorites));
                } catch(e) {}
            }, [favorites]);

            // Toast Trigger
            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => {
                    setToastMessage(null);
                }, 2500);
            };

            // Toggle Favorite
            const toggleFavorite = (appId, e) => {
                if (e) e.stopPropagation();
                if (favorites.includes(appId)) {
                    setFavorites(prev => prev.filter(id => id !== appId));
                    showToast('Removed from Favorites');
                } else {
                    setFavorites(prev => [...prev, appId]);
                    showToast('Saved to Favorites!');
                }
            };

            // Filter & Sort Logic
            const filteredApps = useMemo(() => {
                let list = [...apps];

                // Category Filter
                if (activeCategory === 'favorites') {
                    list = list.filter(app => favorites.includes(app.id));
                } else if (activeCategory !== 'all') {
                    list = list.filter(app => app.category === activeCategory);
                }

                // Search Query Filter
                if (searchQuery.trim()) {
                    const q = searchQuery.toLowerCase();
                    list = list.filter(app =>
                        app.title.toLowerCase().includes(q) ||
                        app.desc.toLowerCase().includes(q) ||
                        app.category.toLowerCase().includes(q)
                    );
                }

                // Sort
                if (sortBy === 'rating') {
                    list.sort((a, b) => b.rating - a.rating);
                } else if (sortBy === 'name') {
                    list.sort((a, b) => a.title.localeCompare(b.title));
                } else {
                    // Popularity (Reviews count)
                    list.sort((a, b) => b.reviews - a.reviews);
                }

                return list;
            }, [apps, activeCategory, searchQuery, sortBy, favorites]);

                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}

                                            >

                                        title="View Favorites"
                                    >

                                </span>
                                <h2 className="text-2xl sm:text-3xl md:text-4xl font-extrabold tracking-tight leading-tight">
                                    Discover & Launch Top Web Applications Instantly
                                </h2>
                                <p className="text-slate-200 text-sm sm:text-base leading-relaxed">
                                    Browse curated online tools, productivity platforms, and web services. One-click access to all your favorite web links.
                                </p>
                            </div>
                        </section>

                        {/* Categories Horizontal Bar */}

                                    return (
                                        <button

                                                isActive 
                                                    ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20' 
                                                    : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
                                            }`}
                                        >
                                            <i className={`fa-solid ${cat.icon}`}></i>
                                            <span>{cat.name}</span>
                                        </button>
                                    );
                                })}
                            </div>
                        </section>

                        {/* Controls Bar (Sorting & Title) */}
                        <section className="space-y-4">
                            <div className="flex flex-wrap items-center justify-between gap-3 pb-2 border-b border-slate-200 dark:border-slate-800">

                                </span>

                                <div className="flex items-center gap-2">

                                    <select

                                        <option value="rating">Top Rated</option>
                                        <option value="name">Name (A-Z)</option>

                            {/* App Cards Grid */}

                                        const isFav = favorites.includes(app.id);
                                        return (
                                            <div 
                                                key={app.id}
                                                className="group bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 hover:shadow-xl hover:border-slate-300 dark:hover:border-slate-700 transition-all duration-200 flex flex-col justify-between relative overflow-hidden animate-fade-in"

                                                <div className="space-y-3">

                                                    <div className="flex items-start justify-between gap-3">
                                                        <div className={`w-12 h-12 rounded-2xl bg-gradient-to-br ${app.bgColor || 'from-blue-500 to-indigo-600'} flex items-center justify-center text-xl shrink-0 shadow-md text-white`}>
                                                            {app.icon.startsWith('fa-') ? (
                                                                <i className={app.icon}></i>
                                                            ) : (
                                                                <span>{app.icon}</span>

                                                        >
                                                            <i className={isFav ? "fa-solid fa-heart text-rose-500" : "fa-regular fa-heart"}></i>
                                                        </button>
                                                    </div>

                                                    {/* App Name & Category */}
                                                    <div>
                                                        <h4 className="font-bold text-base text-slate-900 dark:text-slate-100 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors truncate">
                                                            {app.title}
                                                        </h4>
                                                        <p className="text-xs text-blue-600 dark:text-blue-400 font-medium">
                                                            {app.category}
                                                        </p>
                                                    </div>

                                                    {/* Short Description */}
                                                    <p className="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 leading-relaxed">
                                                        {app.desc}
                                                    </p>
                                                </div>

                                                {/* Card Actions Footer */}
                                                <div className="pt-4 mt-3 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between gap-2">
                                                    <div className="flex items-center gap-1 text-amber-400 text-xs font-semibold">
                                                        <i className="fa-solid fa-star"></i>
                                                        <span className="text-slate-700 dark:text-slate-300">{app.rating}</span>
                                                    </div>

                                                    <div className="flex items-center gap-1.5">
                                                        <button 
                                                            onClick={() => setSelectedApp(app)}
                                                            className="px-2.5 py-1.5 text-xs text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors font-medium"
                                                        >
                                                            Details
                                                        </button>
                                                        <a 
                                                            href={app.url} 
                                                            target="_blank" 
                                                            rel="noopener noreferrer"
                                                            className="px-3 py-1.5 bg-slate-100 hover:bg-blue-600 hover:text-white dark:bg-slate-800 dark:hover:bg-blue-600 text-blue-600 dark:text-blue-400 font-semibold text-xs rounded-lg transition-all flex items-center gap-1.5"
                                                        >
                                                            <span>Launch</span>
                                                            <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                                        </a>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            ) : (
                                /* Empty State */
                                <div className="text-center py-16 space-y-3">
                                    <div className="w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto text-slate-400 text-2xl">
                                        <i className="fa-solid fa-magnifying-glass"></i>
                                    </div>
                                    <h4 className="font-bold text-slate-700 dark:text-slate-300 text-lg">No Applications Found</h4>
                                    <p className="text-sm text-slate-500 max-w-sm mx-auto">
                                        No web applications match your search query or selected category filter. Try clearing your search term.
                                    </p>
                                </div>
                            )}
                        </section>
                    </main>

                    {/* Footer */}
                    <footer className="mt-auto border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-6 transition-colors">
                        <div className="max-w-7xl mx-auto px-4 text-center space-y-2">
                            <p className="text-xs text-slate-500 dark:text-slate-400">
                                © WebStore Directory — All icons & trademarks belong to their respective web owners.
                            </p>
                        </div>
                    </footer>

                    {/* Modal Details View */}
                    {selectedApp && (
                        <div 
                            className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in"
                            onClick={() => setSelectedApp(null)}
                        >
                            <div 
                                className="bg-white dark:bg-slate-900 rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-800 relative space-y-5"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <button 
                                    onClick={() => setSelectedApp(null)}
                                    className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 w-8 h-8 rounded-full flex items-center justify-center bg-slate-100 dark:bg-slate-800 transition-colors"
                                >
                                    <i className="fa-solid fa-xmark"></i>
                                </button>

                                <div className="flex items-start gap-4 pr-6">
                                    <div className={`w-16 h-16 rounded-2xl bg-gradient-to-br ${selectedApp.bgColor || 'from-blue-500 to-indigo-600'} flex items-center justify-center text-2xl shrink-0 shadow-md text-white`}>
                                        {selectedApp.icon.startsWith('fa-') ? (
                                            <i className={selectedApp.icon}></i>
                                        ) : (
                                            <span>{selectedApp.icon}</span>
                                        )}
                                    </div>
                                    <div>
                                        <h3 className="text-xl font-bold text-slate-900 dark:text-slate-100">{selectedApp.title}</h3>
                                        <p className="text-xs text-blue-600 dark:text-blue-400 font-medium">{selectedApp.category}</p>
                                        <div className="flex items-center gap-1.5 mt-1 text-amber-400 text-xs font-semibold">
                                            <i className="fa-solid fa-star"></i>
                                            <span className="text-slate-700 dark:text-slate-300">{selectedApp.rating}</span>
                                            <span className="text-slate-400 font-normal">({selectedApp.reviews.toLocaleString()} User Ratings)</span>
                                        </div>
                                    </div>
                                </div>

                                <p className="text-sm text-slate-600 dark:text-slate-300 leading-relaxed">
                                    {selectedApp.desc}
                                </p>

                                <div className="bg-slate-50 dark:bg-slate-800/60 rounded-xl p-3 flex items-center justify-between text-xs font-mono text-slate-500 dark:text-slate-400 overflow-hidden">
                                    <span className="truncate">{selectedApp.url}</span>
                                    <button 
                                        onClick={() => {
                                            try {
                                                const tempInput = document.createElement('input');
                                                tempInput.value = selectedApp.url;
                                                document.body.appendChild(tempInput);
                                                tempInput.select();
                                                document.execCommand('copy');
                                                document.body.removeChild(tempInput);
                                                showToast('URL Copied to Clipboard!');
                                            } catch(err) {
                                                showToast('Copied link');
                                            }
                                        }}
                                        className="ml-2 text-blue-600 dark:text-blue-400 hover:underline shrink-0 font-sans font-semibold flex items-center gap-1"
                                    >
                                        <i className="fa-solid fa-copy"></i> Copy
                                    </button>
                                </div>

                                <div className="flex items-center gap-3 pt-2">
                                    <button 
                                        onClick={(e) => toggleFavorite(selectedApp.id, e)}
                                        className="flex-1 py-3 px-4 rounded-xl border border-slate-200 dark:border-slate-700 font-semibold text-sm flex items-center justify-center gap-2 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all text-slate-700 dark:text-slate-200"
                                    >
                                        <i className={favorites.includes(selectedApp.id) ? "fa-solid fa-heart text-rose-500" : "fa-regular fa-heart text-rose-500"}></i>
                                        <span>{favorites.includes(selectedApp.id) ? 'Bookmarked' : 'Add Favorite'}</span>
                                    </button>
                                    <a 
                                        href={selectedApp.url} 
                                        target="_blank" 
                                        rel="noopener noreferrer"
                                        className="flex-1 py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm flex items-center justify-center gap-2 shadow-lg shadow-blue-600/25 transition-all"
                                    >
                                        <span>Visit Website</span>
                                        <i className="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toast Notification Component */}
                    {toastMessage && (
                        <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 text-sm font-medium animate-fade-in">
                            <i className="fa-solid fa-circle-check text-emerald-400"></i>
                            <span>{toastMessage}</span>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
